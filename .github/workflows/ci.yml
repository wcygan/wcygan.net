name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first — the TanStack Start Vite plugin generates
      # src/routeTree.gen.ts during build, and typecheck imports it.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Install Temporal example dependencies
        working-directory: examples/temporal-intro
        run: npm ci

      - name: Typecheck Temporal example
        working-directory: examples/temporal-intro
        run: npm run check

      - name: Test
        run: bun run test
