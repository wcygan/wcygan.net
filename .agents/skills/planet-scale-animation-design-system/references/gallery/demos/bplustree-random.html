@keyframes animateModalIn {
  0% {
    transform: scale(0.75);
    opacity: 0%;
    display: inline-block;
    z-index: 1000;
  }
  to {
    transform: scale(1);
    opacity: 100%;
    display: inline-block;
    z-index: 1000;
  }
}

  0% {
    transform: scale(1);
    opacity: 100%;
    z-index: 1000;

  to {

    opacity: 0%;
