name: clickhouse-primer-lab

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.8.3@sha256:230b973a00b5bac5b8925bd2898fae95a039aa6f25063fa8c507ffe9e2c7d770
    environment:
      CLICKHOUSE_USER: practice
      CLICKHOUSE_PASSWORD: practice-local-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - 127.0.0.1:8124:8123
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}" --query 'SELECT 1'
          >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  clickhouse-data:
